# World Trade food prices, paid in COPPER INGOT VALUE per item.
# 10 copper = 1 emerald, 10 emeralds = 1 iron (so 100 copper = 1 iron),
# 10 iron = 1 gold, 10 gold = 1 diamond.
# Payment is automatically converted into the highest ingots/emeralds possible.
# Prices are the old values x10, so every food is worth the same in iron/gold
# as before - it just pays out in emeralds now (e.g. 40 copper = 4 emeralds).
# Benchmark: a Stone Miner earns 2 gold (2000 copper) per 64 stone.
# Golden apples and golden carrots are always refused. Max 45 items shown.
prices:
  MELON_SLICE: 20
  SWEET_BERRIES: 30
  GLOW_BERRIES: 30
  DRIED_KELP: 30          # "cooked kelp"
  POTATO: 40
  CARROT: 40
