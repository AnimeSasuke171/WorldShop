# World Trade food prices, paid in COPPER INGOT VALUE per item.
# 10 copper = 1 iron, 100 copper = 1 gold, 1000 copper = 1 diamond.
# Payment is automatically converted into the highest ingots possible.
# Benchmark: a Stone Miner earns 2 gold (200 copper) per 64 stone (~3.1 each).
# Each price below is the higher of the old and rebalanced price.
# Golden apples and golden carrots are always refused (players already
# have a reason to make those). Max 45 items shown in the menu.
prices:
  MELON_SLICE: 2
  SWEET_BERRIES: 3
  GLOW_BERRIES: 3
  DRIED_KELP: 3          # "cooked kelp"
  POTATO: 4
  CARROT: 4
  BEETROOT: 4
  COOKIE: 4
  APPLE: 5
  BAKED_POTATO: 7
  PUMPKIN: 8
  COOKED_COD: 8
  COOKED_SALMON: 9
  COOKED_CHICKEN: 9
  MELON: 10
  COOKED_BEEF: 10
  COOKED_PORKCHOP: 10
  COOKED_MUTTON: 10
  BREAD: 12
  COOKED_RABBIT: 12
  MUSHROOM_STEW: 14
  HONEY_BOTTLE: 16
  PUMPKIN_PIE: 20
  SUSPICIOUS_STEW: 30
  BEETROOT_SOUP: 32
  RABBIT_STEW: 50
